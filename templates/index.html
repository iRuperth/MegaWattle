<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MegaWattle — De residuo a megavatio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="bg-slate-900 text-white px-6 py-3 flex items-center justify-between shadow">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-400 to-sky-500"></div>
      <h1 class="text-xl font-semibold">MegaWattle</h1>
      <span class="text-xs text-slate-300 hidden md:inline">De residuo a megavatio · ODS 6 + ODS 7</span>
    </div>
    <div class="flex gap-3 text-sm">
      <button id="btn-fuentes" class="hover:underline">Fuentes</button>
      <a href="https://github.com/" target="_blank" class="hover:underline">GitHub</a>
    </div>
  </header>

  <main class="grid grid-cols-1 lg:grid-cols-[360px_1fr] h-[calc(100vh-56px)]">
    <aside class="bg-white border-r overflow-y-auto p-4 space-y-6">
      <section>
        <h2 class="text-sm font-bold uppercase tracking-wide text-slate-500 mb-2">Paso 1 · Filtrar centros de datos</h2>
        <label class="block text-xs mb-1">Comunidad Autónoma</label>
        <select id="filter-ccaa" class="w-full border rounded px-2 py-1 text-sm mb-2">
          <option value="">— Todas —</option>
        </select>
        <label class="block text-xs mb-1">Provincia</label>
        <select id="filter-provincia" class="w-full border rounded px-2 py-1 text-sm">
          <option value="">— Todas —</option>
        </select>
      </section>

      <section>
        <h2 class="text-sm font-bold uppercase tracking-wide text-slate-500 mb-2">Paso 2 · Elegir CPD (1 o 2)</h2>
        <div id="cpd-list" class="space-y-1 max-h-64 overflow-y-auto text-sm">
          <p class="text-slate-400 italic">Cargando…</p>
        </div>
      </section>

      <section>
        <h2 class="text-sm font-bold uppercase tracking-wide text-slate-500 mb-2">Paso 3 · Parámetros</h2>
        <label class="block text-xs mb-1">Radio (km): <span id="radio-value">30</span></label>
        <input id="filter-radio" type="range" min="5" max="100" value="30" class="w-full mb-2" />
        <label class="block text-xs mb-1">Tipo animal (opcional)</label>
        <select id="filter-animal" class="w-full border rounded px-2 py-1 text-sm mb-3">
          <option value="">— Cualquiera —</option>
          <option value="porcino">Porcino</option>
          <option value="vacuno">Vacuno</option>
          <option value="avicola">Avícola</option>
        </select>
        <button id="btn-match" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded py-2">
          Buscar granjas
        </button>
      </section>

      <section>
        <h2 class="text-sm font-bold uppercase tracking-wide text-slate-500 mb-2">Presets demo</h2>
        <div class="grid grid-cols-2 gap-2">
          <button class="preset-btn border rounded py-1 text-xs hover:bg-slate-100" data-preset="aragon">Aragón</button>
          <button class="preset-btn border rounded py-1 text-xs hover:bg-slate-100" data-preset="madrid">Madrid</button>
          <button class="preset-btn border rounded py-1 text-xs hover:bg-slate-100" data-preset="cataluna">Cataluña</button>
          <button class="preset-btn border rounded py-1 text-xs hover:bg-slate-100" data-preset="castilla-leon">Castilla y León</button>
        </div>
      </section>
    </aside>

    <section class="flex flex-col">
      <div id="map" class="flex-1 min-h-[320px]"></div>
      <div id="results-panel" class="bg-white border-t p-4 max-h-[55%] overflow-y-auto hidden">
        <div id="results-summary"></div>
        <div id="results-tables" class="mt-4"></div>
        <div class="mt-4">
          <button id="btn-ai" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded px-4 py-2">
            Generar análisis con IA
          </button>
        </div>
        <div id="ai-panel" class="mt-4 hidden"></div>
      </div>
    </section>
  </main>

  <div id="modal-fuentes" class="hidden fixed inset-0 bg-black/50 z-[1000] flex items-center justify-center p-4">
    <div class="bg-white rounded-lg max-w-2xl w-full max-h-[80vh] overflow-y-auto p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold">Fuentes y metodología</h3>
        <button id="modal-close" class="text-2xl leading-none">&times;</button>
      </div>
      <div id="modal-content" class="prose prose-sm">
        <p class="text-slate-500 italic">Cargando…</p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="{{ url_for('static', filename='js/map.js') }}"></script>
  <script src="{{ url_for('static', filename='js/filters.js') }}"></script>
  <script src="{{ url_for('static', filename='js/results.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ai-panel.js') }}"></script>
  <script>
    const modalFuentes = document.getElementById("modal-fuentes");
    const modalContent = document.getElementById("modal-content");
    document.getElementById("btn-fuentes").addEventListener("click", async () => {
      modalFuentes.classList.remove("hidden");
      try {
        const res = await fetch("/fuentes");
        const md = await res.text();
        modalContent.innerHTML = marked.parse(md);
      } catch (e) {
        modalContent.innerHTML = '<p class="text-red-600">Error cargando fuentes</p>';
      }
    });
    document.getElementById("modal-close").addEventListener("click", () => {
      modalFuentes.classList.add("hidden");
    });
    modalFuentes.addEventListener("click", (e) => {
      if (e.target === modalFuentes) modalFuentes.classList.add("hidden");
    });
  </script>
</body>
</html>
